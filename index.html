<script>
    function updateBalk(textId, balkId, padding = 40) {
      const textEl = document.getElementById(textId);
      const balkEl = document.getElementById(balkId);

      // Pak de exacte breedte van de getypte tekst
      const textWidth = textEl.getBBox().width;

      // Als er geen tekst is, verberg de balk
      if (textWidth === 0) {
        balkEl.setAttribute('width', 0);
      } else {
        // Stel de breedte in inclusief padding
        balkEl.setAttribute('width', textWidth + padding);
      }
    }

    // Luister naar de input-velden op je pagina
    document.getElementById('input-kop-1').addEventListener('input', (e) => {
      const textEl = document.getElementById('text-kop-1');
      textEl.textContent = e.target.value;
      updateBalk('text-kop-1', 'balk-kop-1', 40);
    });
  </script>
